<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dhruvi, Will You Be My Valentine?</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 40px 32px 48px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      position: relative;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #e11d48;
    }

    p {
      font-size: 16px;
      color: #444;
      margin-bottom: 28px;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    button {
      border: none;
      padding: 14px 22px;
      border-radius: 999px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    #yesBtn {
      background: #e11d48;
      color: white;
      box-shadow: 0 10px 20px rgba(225,29,72,0.4);
    }

    #noBtn {
      background: #f3f4f6;
      color: #111;
      position: relative;
    }

    .hidden {
      display: none;
    }

    .celebrate {
      font-size: 22px;
      color: #16a34a;
      margin-top: 20px;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: floatUp 3s linear forwards;
      opacity: 0.9;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) scale(1.4);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>💌 Hey Dhruvi</h1>
    <p>I was wondering…</p>
    <h1>Will you be my Valentine?</h1>

    <div class="buttons" id="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 🙃</button>
    </div>

    <div class="hidden" id="response">
      <div class="celebrate">Yay, Dhruvi! You just made my day 💘</div>
      <p>Happy Valentine’s Day 🥰 Can't wait to make it special with you!</p>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const buttons = document.getElementById('buttons');
    const response = document.getElementById('response');

    let dodgeCount = 0;

    noBtn.addEventListener('mouseover', () => {
      dodgeCount++;
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;

      if (dodgeCount > 5) {
        noBtn.textContent = 'Okay okay 😅';
      }
    });

    yesBtn.addEventListener('click', () => {
      buttons.classList.add('hidden');
      response.classList.remove('hidden');
      launchHearts();
    });

    function launchHearts() {
      for (let i = 0; i < 30; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = '💖';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.bottom = '-20px';
        heart.style.animationDelay = Math.random() * 1.5 + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 3000);
      }
    }
  </script>
</body>
</html>
